        - $ref: '#/components/schemas/EmptyDataResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/User'

    MessageResponse:
      allOf:
        - $ref: '#/components/schemas/EmptyDataResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Message'

    StrippedUserListResponse:
      allOf:
        - $ref: '#/components/schemas/EmptyDataResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/StrippedUser'
    
    RelationsListResponse:
      allOf:
        - $ref: '#/components/schemas/EmptyDataResponse'
        - type: object
          properties:
