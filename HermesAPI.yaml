openapi: 3.0.3
info:
  title: Hermes API
  version: 2.0.0
  description: |
    Messaging service with guilds (channels), direct messages, friend relations and file objects.

    **Response envelope.** Every JSON response has the shape `{ "success": bool, "msg": string, "data": ... }`.
    The HTTP status code carries the result; `data` is `null` for operations that return nothing.

    **Pagination.** List endpoints come in pairs: `GET .../initial` returns the first page and
    `GET .../page/{cursor}` returns the next one. A page holds at most 50 items, newest first.
    `data` is `{ "cursor": ..., "pages": [...] }`. `cursor` is the id of the last item on the page
    (a UUID for most lists, an int64 for messages) and is `null` once there is nothing further.
    An empty first page is reported as 404 (NoMatches); an empty later page returns 200 with an empty `pages` array.

    **Errors.** Status codes are listed per endpoint with the server's internal error name in parentheses.
    Membership and ownership failures on guild resources are mostly reported as 404 (NoMatches) rather than 403.

servers:
  - url: http://127.0.0.1:8080/apiV1
    description: Local development server

tags:
  - name: Auth
  - name: Invites
  - name: Users
  - name: Relations
  - name: DMs
  - name: Guilds
  - name: Channels
  - name: Messages
  - name: Objects
  - name: WebSockets

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: "Log in"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginCred'
      responses:
        '200':
          description: "Authenticated. Returns the User record plus a fresh access/refresh token pair."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTokenObjResponse'
        '401':
          description: "Wrong username/password (InvalidCredentials). Any failure of the credential lookup is reported this way."
        '500':
          description: "JWT encode error (DecodeEncodeErr)"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: "Exchange a refresh token for a new token pair"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshBody'
      responses:
        '200':
          description: "New token pair issued. The submitted refresh token is revoked and cannot be used again."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '401':
          description: "Token failed to decode/verify (InvalidToken), was not a Refresh token (WrongTokenType), was already used/revoked (ExpiredToken), or has under 60s of life left (InvalidToken)"
        '500':
          description: "Redis error or JWT encode error"

  /auth/sign_up:
    post:
      tags: [Auth]
      summary: "Create a new user account"
      description: "Requires an invite JWT issued by POST /invite/new_user. The invite is single-use and is only consumed once the account has actually been created, so a failed sign-up can be retried with the same invite."
      security: [{inviteBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupCred'
      responses:
        '200':
          description: "Account created. Returns the new User record plus a fresh token pair."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTokenObjResponse'
        '400':
          description: "nickname shorter than 3 characters after trimming (InvalidNickname), or username/password shorter than 3 after trimming (InvalidAccountCredentials)"
        '401':
          description: "Invite JWT missing, invalid, expired, or already used (InvalidToken)"
        '500':
          description: "Db error (e.g. the insert failed), Redis error, or JWT encode error"

  /invite/new_user:
    post:
      tags: [Invites]
      summary: "Issue a sign-up invite"
      description: "Caller must hold Proprietor privilege. The returned JWT carries the privilege level the new account will receive and is passed as the bearer token to /auth/sign_up."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivLevel'
      responses:
        '201':
          description: "Invite JWT created"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvJwtResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: "Caller does not hold Proprietor privilege (InvalidPrivilige)"
        '500':
          description: "Db error or JWT encode error"

  /user/me:
    delete:
      tags: [Users]
      summary: "Delete the current user's account"
      description: "Fails while the caller is the sole Owner of any guild. Direct messages the caller took part in remain, with the caller's slot cleared; messages they authored keep existing with no author. A DM with no participants left is removed by the database."
      responses:
        '200':
          description: "Account deleted"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "No matching user (NoMatches)"
        '409':
          description: "Caller is the only Owner of at least one guild (DetachingOperation)"
        '500':
          description: "Db error"
    patch:
      tags: [Users]
      summary: "Update the current user's profile"
      description: "Full replacement of nickname, username, password and pfp. The caller's privilege level cannot be changed here."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: "User updated (the response body carries no data)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: "nickname shorter than 3 characters after trimming (InvalidNickname), or username/password shorter than 3 after trimming (InvalidAccountCredentials)"
        '500':
          description: "Db error (including a username that is already taken) or the caller's record could not be loaded"

  /object/upload:
    post:
      tags: [Objects]
      summary: "Upload one or more files"
      description: "Each multipart field is one file. Files are deduplicated by SHA-256 of their content; the stored mime type is inferred from the bytes, not from the client. Upload handling is a temporary implementation and will change when storage moves to an S3-style backend."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadForm'
      responses:
        '201':
          description: "Objects stored; returns one object id per uploaded field, in order"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectIdsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: "Malformed multipart body (BadRequest)"
        '413':
          description: "Body exceeded 10,000,000 bytes (BodyTooLarge)"
        '415':
          description: "File type could not be inferred from its content (UnknownType)"
        '500':
          description: "Db error, or filesystem error (OperationsError)"

  /object/pull/{object_id}:
    get:
      tags: [Objects]
      summary: "Fetch a previously uploaded object"
      description: "Any authenticated user can fetch an object whose id they know."
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          description: "Empty body. The handler answers with an X-Accel-Redirect header and the object's Content-Type; the reverse proxy (nginx) then serves the file from disk."
          headers:
            X-Accel-Redirect:
              schema:
                type: string
              description: Internal path nginx serves the file from
            Content-Type:
              schema:
                type: string
              description: The object's stored mime type
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "Object not found (NoMatches)"

  /relation/friend/initial:
    get:
      tags: [Relations]
      summary: "List friends (first page)"
      description: "Only users in the Friends state are returned: pending requests (see /relation/invite) and blocked users are not. Newest first, 50 per page."
      responses:
        '200':
          description: "Page of results"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "No friends on the first page (NoMatches)"

  /relation/friend/page/{cursor}:
    get:
      tags: [Relations]
      summary: "List friends (next page)"
      description: "Only users in the Friends state are returned: pending requests (see /relation/invite) and blocked users are not. Newest first, 50 per page."
      parameters:
        - $ref: '#/components/parameters/CursorUuid'
      responses:
        '200':
          description: "Page of results"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "No friends on the first page (NoMatches)"

  /relation/invite/initial:
    get:
      tags: [Invites]
      summary: "List incoming friend requests (first page)"
      description: "Users who sent the caller a friend request that is still pending. Newest first, 50 per page."
      responses:
        '200':
          description: "Page of results"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "No requests on the first page (NoMatches)"

  /relation/invite/page/{cursor}:
    get:
      tags: [Invites]
      summary: "List incoming friend requests (next page)"
      description: "Users who sent the caller a friend request that is still pending. Newest first, 50 per page."
      parameters:
        - $ref: '#/components/parameters/CursorUuid'
      responses:
        '200':
          description: "Page of results"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "No requests on the first page (NoMatches)"

  /relation/{user_id}/invite:
    post:
      tags: [Invites]
      summary: "Send a friend request"
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '201':
          description: "Request created in the Pending state"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: "Caller targeted themselves (SelfInvite)"
        '403':
          description: "A block exists in either direction between the two users (UserUnreachable)"
        '404':
          description: "Target user not found (NoMatches)"
        '409':
          description: "A relation or request already exists between the two users, in either direction (DuplicateData)"
        '500':
          description: "Db error"

  /relation/invite/{user_id}:
    patch:
      tags: [Invites]
      summary: "Accept or decline a friend request"
      description: "user_id is the user who sent the request."
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvMng'
      responses:
        '200':
          description: "Processed. Accepting makes both users Friends of each other; declining deletes the request."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "No pending request from that user to the caller (NoMatches)"
        '500':
          description: "Db error"

  /relation/toggle/{user_id}/block:
    patch:
      tags: [Relations]
      summary: "Toggle block on a user"
      description: "No request body. Only the caller's own relation row is changed; the other user's row is left as it is. A block prevents the blocked user from sending friend requests, DM invites and guild invites to the blocker."
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: "Caller's relation to the user flipped: Friends becomes Blocked, Blocked becomes Friends"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: "Caller targeted themselves (SelfInvite)"
        '403':
          description: "The relation is still Pending and cannot be toggled (NonOwner)"
        '404':
          description: "The caller has no relation row with that user (NoMatches)"
        '500':
          description: "Db error"

  /relation/{user_id}:
    delete:
      tags: [Relations]
      summary: "Remove the relation with a user"
      description: "Currently deletes the relation in both directions between the caller and the user, including a block set by the other user. This behaviour may be restricted once block semantics are finalised."
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: "Relation removed"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: "Caller targeted themselves (SelfInvite)"
        '404':
          description: "No relation exists between the two users (NoMatches)"
        '500':
          description: "Db error"

  /dm/member/{member_id}:
    post:
      tags: [DMs]
      summary: "Start a DM with another user"
      description: "No request body. The DM only becomes shared once the invitee accepts. The inviter can already post in it while it is pending. A declined invite leaves the one-sided DM behind."
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '201':
          description: "DM created with the caller as its only participant, plus a pending invite for member_id"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: "Caller targeted themselves (SelfInvite)"
        '403':
          description: "The target has blocked the caller (Blocked)"
        '404':
          description: "Target user not found (NoMatches)"
        '409':
          description: "The two users already share a DM, or an invite exists between them in either direction (DuplicateData)"
        '500':
          description: "Db error"

  /dm/initial:
    get:
      tags: [DMs]
      summary: "List the caller's DMs (first page)"
      description: "DMs the caller participates in, including pending ones the caller started (user_b is null). Newest first, 50 per page."
      responses:
        '200':
          description: "Page of results"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DmPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "No DMs on the first page (NoMatches)"

  /dm/page/{cursor}:
    get:
      tags: [DMs]
      summary: "List the caller's DMs (next page)"
      description: "DMs the caller participates in, including pending ones the caller started (user_b is null). Newest first, 50 per page."
      parameters:
        - $ref: '#/components/parameters/CursorUuid'
      responses:
        '200':
          description: "Page of results"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DmPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "No DMs on the first page (NoMatches)"

  /dm/invite/initial:
    get:
      tags: [Invites]
      summary: "List incoming DM invites (first page)"
      description: "Pending DM invites addressed to the caller. Newest first, 50 per page."
      responses:
        '200':
          description: "Page of results"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DmInvitePageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "No invites on the first page (NoMatches)"

  /dm/invite/page/{cursor}:
    get:
      tags: [Invites]
      summary: "List incoming DM invites (next page)"
      description: "Pending DM invites addressed to the caller. Newest first, 50 per page."
      parameters:
        - $ref: '#/components/parameters/CursorUuid'
      responses:
        '200':
          description: "Page of results"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DmInvitePageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "No invites on the first page (NoMatches)"

  /dm/invite/{invite_id}:
    patch:
      tags: [Invites]
      summary: "Accept or decline a DM invite"
      description: "The two participants are stored in a canonical order (user_a is the lower UUID), so after accepting, user_a/user_b no longer indicate who started the DM."
      parameters:
        - $ref: '#/components/parameters/InviteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvMng'
      responses:
        '200':
          description: "Processed. Accepting adds the caller to the DM; the invite is deleted either way."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "Invite not found, not addressed to the caller, or the DM has no remaining participant (NoMatches)"
        '500':
          description: "Db error"

  /dm/{dm_id}:
    delete:
      tags: [DMs]
      summary: "Delete a DM"
      parameters:
        - $ref: '#/components/parameters/DmId'
      responses:
        '200':
          description: "DM deleted for both participants"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: "Caller is not a participant (InvalidPrivilige)"
        '404':
          description: "DM not found (NoMatches)"
        '500':
          description: "Db error"

  /dm/{dm_id}/message:
    post:
      tags: [Messages]
      summary: "Post a DM message"
      parameters:
        - $ref: '#/components/parameters/DmId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Msg'
      responses:
        '201':
          description: "Message created"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: "No message text and no file_ids (EmptyMessage)"
        '403':
          description: "Caller is not a participant of the DM (NonOwner)"
        '404':
          description: "DM not found (NoMatches)"
        '500':
          description: "Db error, e.g. an attached file id does not exist. The message is rolled back."

  /dm/{dm_id}/message/initial:
    get:
      tags: [Messages]
      summary: "List DM messages (first page)"
      description: "Newest first, 50 per page. The cursor is the id of the oldest message on the page; pass it to /page/{cursor} to fetch older messages. Only participants can read."
      parameters:
        - $ref: '#/components/parameters/DmId'
      responses:
        '200':
          description: "Page of results"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DmMessagePageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "No messages on the first page, or the caller is not a participant (NoMatches)"

  /dm/{dm_id}/message/page/{cursor}:
    get:
      tags: [Messages]
      summary: "List DM messages (next page)"
      description: "Newest first, 50 per page. The cursor is the id of the oldest message on the page; pass it to /page/{cursor} to fetch older messages. Only participants can read."
      parameters:
        - $ref: '#/components/parameters/DmId'
        - $ref: '#/components/parameters/CursorInt'
      responses:
        '200':
          description: "Page of results"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DmMessagePageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "No messages on the first page, or the caller is not a participant (NoMatches)"

  /dm/{dm_id}/message/{message_id}:
    patch:
      tags: [Messages]
      summary: "Edit a DM message"
      parameters:
        - $ref: '#/components/parameters/DmId'
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Msg'
      responses:
        '200':
          description: "Message updated; attached files are diffed against file_ids"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: "No message text and no file_ids (EmptyMessage)"
        '403':
          description: "Caller is not the message's author (NonOwner)"
        '404':
          description: "DM or message not found (NoMatches)"
        '500':
          description: "Db error, or the message has no author left (DetachedOwner)"
    delete:
      tags: [Messages]
      summary: "Delete a DM message"
      description: "Only the author can delete a DM message."
      parameters:
        - $ref: '#/components/parameters/DmId'
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: "Message deleted"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: "Caller is not the message's author (NonOwner)"
        '404':
          description: "DM or message not found (NoMatches)"
        '500':
          description: "Db error"

  /guild:
    post:
      tags: [Guilds]
      summary: "Create a guild"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Grp'
      responses:
        '201':
          description: "Guild created with the caller as Owner and a default Text channel named \"main\""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: "Db error. Partially created guilds are rolled back."

  /guild/initial:
    get:
      tags: [Guilds]
      summary: "List the caller's guilds (first page)"
      description: "Guilds the caller is a member of. Newest first, 50 per page."
      responses:
        '200':
          description: "Page of results"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "No guilds on the first page (NoMatches)"

  /guild/page/{cursor}:
    get:
      tags: [Guilds]
      summary: "List the caller's guilds (next page)"
      description: "Guilds the caller is a member of. Newest first, 50 per page."
      parameters:
        - $ref: '#/components/parameters/CursorUuid'
      responses:
        '200':
          description: "Page of results"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "No guilds on the first page (NoMatches)"

  /guild/invite/initial:
    get:
      tags: [Invites]
      summary: "List incoming guild invites (first page)"
      description: "Pending guild invites addressed to the caller. Newest first, 50 per page."
      responses:
        '200':
          description: "Page of results"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildInvitePageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "No invites on the first page (NoMatches)"

  /guild/invite/page/{cursor}:
    get:
      tags: [Invites]
      summary: "List incoming guild invites (next page)"
      description: "Pending guild invites addressed to the caller. Newest first, 50 per page."
      parameters:
        - $ref: '#/components/parameters/CursorUuid'
      responses:
        '200':
          description: "Page of results"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildInvitePageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "No invites on the first page (NoMatches)"

  /guild/invite/{invite_id}:
    patch:
      tags: [Invites]
      summary: "Accept or decline a guild invite"
      parameters:
        - $ref: '#/components/parameters/InviteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvMng'
      responses:
        '200':
          description: "Processed. Accepting creates the membership at the invite's rank; the invite is deleted either way."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "Invite not found or not addressed to the caller (NoMatches)"
        '500':
          description: "Db error"

  /guild/{guild_id}:
    patch:
      tags: [Guilds]
      summary: "Update a guild"
      parameters:
        - $ref: '#/components/parameters/GuildId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Grp'
      responses:
        '200':
          description: "Guild updated"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: "Caller is not an Owner (InvalidPrivilige)"
        '404':
          description: "Guild not found, or the caller is not a member (NoMatches)"
        '500':
          description: "Db error"
    delete:
      tags: [Guilds]
      summary: "Delete a guild"
      parameters:
        - $ref: '#/components/parameters/GuildId'
      responses:
        '200':
          description: "Guild deleted"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: "Caller is a member but not an Owner (InvalidPrivilige)"
        '404':
          description: "Guild not found, or the caller is not a member (NoMatches)"
        '500':
          description: "Db error"

  /guild/{guild_id}/member/initial:
    get:
      tags: [Guilds]
      summary: "List guild members (first page)"
      description: "Members with their rank. Caller must be a member. Ordered by user id descending, 50 per page."
      parameters:
        - $ref: '#/components/parameters/GuildId'
      responses:
        '200':
          description: "Page of results"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildMemberPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "No members on the first page, guild not found, or the caller is not a member (NoMatches)"

  /guild/{guild_id}/member/page/{cursor}:
    get:
      tags: [Guilds]
      summary: "List guild members (next page)"
      description: "Members with their rank. Caller must be a member. Ordered by user id descending, 50 per page."
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/CursorUuid'
      responses:
        '200':
          description: "Page of results"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildMemberPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "No members on the first page, guild not found, or the caller is not a member (NoMatches)"

  /guild/{guild_id}/invite:
    post:
      tags: [Invites]
      summary: "Invite a user to a guild"
      parameters:
        - $ref: '#/components/parameters/GuildId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrpInv'
      responses:
        '201':
          description: "Invite created"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: "Caller targeted themselves (SelfInvite)"
        '403':
          description: "Caller's rank is lower than the rank being granted (InvalidPrivilige), or the target has blocked the caller (Blocked)"
        '404':
          description: "Caller is not a member of the guild, or the target user does not exist (NoMatches)"
        '409':
          description: "The target is already a member, or already has a pending invite to this guild (DuplicateData)"
        '500':
          description: "Db error"

  /guild/{guild_id}/member/{member_id}:
    delete:
      tags: [Guilds]
      summary: "Remove a member, or leave a guild"
      description: "Passing your own id leaves the guild. Removing someone else requires a strictly higher rank. The last remaining Owner cannot be removed or leave."
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: "Member removed"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: "Caller's rank is not strictly higher than the target's (InvalidPrivilige)"
        '404':
          description: "Caller or target is not a member of the guild (NoMatches)"
        '409':
          description: "The removal would leave the guild without an Owner (DetachingOperation)"
        '500':
          description: "Db error"

  /guild/{guild_id}/channel:
    post:
      tags: [Channels]
      summary: "Create a channel"
      description: "The path has no trailing slash."
      parameters:
        - $ref: '#/components/parameters/GuildId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Chnl'
      responses:
        '201':
          description: "Channel created"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: "Caller's rank is below Admin (InvalidPrivilige)"
        '404':
          description: "Caller is not a member of the guild (NoMatches)"
        '500':
          description: "Db error"

  /guild/{guild_id}/channel/initial:
    get:
      tags: [Channels]
      summary: "List a guild's channels (first page)"
      description: "Caller must be a member of the guild. Ordered by channel id descending, 50 per page."
      parameters:
        - $ref: '#/components/parameters/GuildId'
      responses:
        '200':
          description: "Page of results"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "No channels on the first page, or the caller is not a member (NoMatches)"

  /guild/{guild_id}/channel/page/{cursor}:
    get:
      tags: [Channels]
      summary: "List a guild's channels (next page)"
      description: "Caller must be a member of the guild. Ordered by channel id descending, 50 per page."
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/CursorUuid'
      responses:
        '200':
          description: "Page of results"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "No channels on the first page, or the caller is not a member (NoMatches)"

  /guild/{guild_id}/channel/{channel_id}:
    patch:
      tags: [Channels]
      summary: "Rename a channel"
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelUpdate'
      responses:
        '200':
          description: "Channel updated"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: "Caller's rank is below Admin (InvalidPrivilige)"
        '404':
          description: "Caller is not a member, or the channel does not belong to this guild (NoMatches)"
        '500':
          description: "Db error"
    delete:
      tags: [Channels]
      summary: "Delete a channel"
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: "Channel deleted"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: "Caller's rank is below Admin (InvalidPrivilige)"
        '404':
          description: "Caller is not a member, or the channel does not belong to this guild (NoMatches)"
        '500':
          description: "Db error"

  /guild/{guild_id}/channel/{channel_id}/message:
    post:
      tags: [Messages]
      summary: "Post a channel message"
      description: "Any guild member can post; no minimum rank is required."
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Msg'
      responses:
        '201':
          description: "Message created"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: "No message text and no file_ids (EmptyMessage)"
        '404':
          description: "Caller is not a member, or the channel does not belong to this guild (NoMatches)"
        '500':
          description: "Db error, e.g. an attached file id does not exist. The message is rolled back."

  /guild/{guild_id}/channel/{channel_id}/message/initial:
    get:
      tags: [Messages]
      summary: "List channel messages (first page)"
      description: "Newest first, 50 per page. The cursor is the id of the oldest message on the page; pass it to /page/{cursor} to fetch older messages. Caller must be a member of the guild and the channel must belong to it."
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: "Page of results"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildMessagePageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "No messages on the first page, caller not a member, or channel not in this guild (NoMatches)"

  /guild/{guild_id}/channel/{channel_id}/message/page/{cursor}:
    get:
      tags: [Messages]
      summary: "List channel messages (next page)"
      description: "Newest first, 50 per page. The cursor is the id of the oldest message on the page; pass it to /page/{cursor} to fetch older messages. Caller must be a member of the guild and the channel must belong to it."
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/CursorInt'
      responses:
        '200':
          description: "Page of results"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildMessagePageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "No messages on the first page, caller not a member, or channel not in this guild (NoMatches)"

  /guild/{guild_id}/channel/{channel_id}/message/{message_id}:
    patch:
      tags: [Messages]
      summary: "Edit a channel message"
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Msg'
      responses:
        '200':
          description: "Message updated; attached files are diffed against file_ids"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: "No message text and no file_ids (EmptyMessage)"
        '403':
          description: "Caller is not the message's author (NonOwner)"
        '404':
          description: "Caller is not a member, or the channel/message was not found in this guild (NoMatches)"
        '500':
          description: "Db error, or the message has no author left (DetachedOwner)"
    delete:
      tags: [Messages]
      summary: "Delete a channel message"
      description: "Authors can always delete their own messages. Otherwise the caller's rank must be strictly higher than the author's. If the author has left the guild or their account is gone, Admin or Owner is required."
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: "Message deleted"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: "Caller is not the author and does not outrank them (InvalidPrivilige)"
        '404':
          description: "Caller is not a member, or the channel/message was not found in this guild (NoMatches)"
        '500':
          description: "Db error"

  /ws/upgrade:
    get:
      tags: [WebSockets]
      summary: "Open a peer-to-peer call socket (deprecated)"
      description: "Deprecated and being replaced; not covered by this specification. Accepts any method and performs a WebSocket upgrade."
      deprecated: true
      security: []
      responses:
        '101':
          description: "Switching Protocols"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (Claims with tkn_type = Access) validated by the AuthUser extractor.
    inviteBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Sign-up invite JWT issued by POST /invite/new_user. Used only by /auth/sign_up.

  parameters:
    GuildId:
      name: guild_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChannelId:
      name: channel_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DmId:
      name: dm_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MemberId:
      name: member_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    InviteId:
      name: invite_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ObjectId:
      name: object_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageId:
      name: message_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    CursorUuid:
      name: cursor
      in: path
      required: true
      description: The `cursor` value from the previous page.
      schema: { type: string, format: uuid }
    CursorInt:
      name: cursor
      in: path
      required: true
      description: The `cursor` value from the previous page (a message id).
      schema: { type: integer, format: int64 }

  responses:
    Unauthorized:
      description: Missing, invalid, or expired bearer token

  schemas:
    # ---- Envelope ----
    EmptyDataResponse:
      type: object
      properties:
        success: { type: boolean }
        msg: { type: string }
        data: { nullable: true }

    # ---- Enums ----
    PrivilegeT:
      type: string
      enum: [Consumer, Proprietor]
    RankT:
      type: string
      enum: [User, Admin, Owner]
      description: Ordered, User < Admin < Owner.
    RelationT:
      type: string
      enum: [Friends, Pending, Blocked]
    ChannelT:
      type: string
      description: Channel kind. New guilds start with a `Text` channel named "main".
      example: Text

    # ---- Entities ----
    User:
      type: object
      required: [id, nickname, prv, username, password, pfp]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string }
        prv: { $ref: '#/components/schemas/PrivilegeT' }
        username: { type: string }
        password: { type: string }
        pfp: { type: string, format: uuid, nullable: true, description: Object id of the profile picture }
    StrippedUser:
      type: object
      required: [user_id, nickname, pfp]
      properties:
        user_id: { type: string, format: uuid }
        nickname: { type: string }
        pfp: { type: string, format: uuid, nullable: true }
    StrippedMember:
      type: object
      required: [user_id, nickname, pfp, rank]
      properties:
        user_id: { type: string, format: uuid }
        nickname: { type: string }
        pfp: { type: string, format: uuid, nullable: true }
        rank: { $ref: '#/components/schemas/RankT' }
    Guild:
      type: object
      required: [id, name, gp]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        gp: { type: string, format: uuid, nullable: true, description: Object id of the guild picture }
    StrippedChannel:
      type: object
      required: [id, name, category]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { $ref: '#/components/schemas/ChannelT' }
    Dm:
      type: object
      required: [id, user_a, user_b]
      description: |
        A pending DM has the inviter in `user_a` and `user_b` null. After the invite is accepted both are set and
        stored in canonical order (user_a < user_b). A slot is null when that participant's account was deleted.
      properties:
        id: { type: string, format: uuid }
        user_a: { type: string, format: uuid, nullable: true }
        user_b: { type: string, format: uuid, nullable: true }
    Dm_Invite:
      type: object
      required: [id, dm_id, recipient]
      properties:
        id: { type: string, format: uuid }
        dm_id: { type: string, format: uuid }
        recipient: { type: string, format: uuid }
    Guild_Invite:
      type: object
      required: [id, guild_id, recipient, rank]
      properties:
        id: { type: string, format: uuid }
        guild_id: { type: string, format: uuid }
        recipient: { type: string, format: uuid }
        rank: { $ref: '#/components/schemas/RankT' }
    GuildChannelMessage:
      type: object
      required: [id, message, file_ids, channel_id, user_id]
      properties:
        id: { type: integer, format: int64 }
        message: { type: string, nullable: true }
        file_ids: { type: array, items: { type: string, format: uuid } }
        channel_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, nullable: true, description: Null if the author's account was deleted }
    DmMessage:
      type: object
      required: [id, message, file_ids, dm_id, user_id]
      properties:
        id: { type: integer, format: int64 }
        message: { type: string, nullable: true }
        file_ids: { type: array, items: { type: string, format: uuid } }
        dm_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, nullable: true, description: Null if the author's account was deleted }

    # ---- Request bodies ----
    LoginCred:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    SignupCred:
      type: object
      required: [nickname, username, password]
      properties:
        nickname: { type: string, description: At least 3 characters after trimming }
        username: { type: string, description: At least 3 characters after trimming }
        password: { type: string, format: password, description: At least 3 characters after trimming }
    RefreshBody:
      type: object
      required: [refresh_tkn]
      properties:
        refresh_tkn: { type: string }
    UserUpdate:
      type: object
      required: [nickname, username, password]
      properties:
        nickname: { type: string, description: At least 3 characters after trimming }
        username: { type: string, description: At least 3 characters after trimming }
        password: { type: string, format: password, description: At least 3 characters after trimming }
        pfp: { type: string, format: uuid, nullable: true }
    PrivLevel:
      type: object
      required: [prv_level]
      properties:
        prv_level: { $ref: '#/components/schemas/PrivilegeT' }
    Grp:
      type: object
      required: [name]
      properties:
        name: { type: string }
        gp: { type: string, format: uuid, nullable: true }
    GrpInv:
      type: object
      required: [user_id, rank]
      properties:
        user_id: { type: string, format: uuid }
        rank: { $ref: '#/components/schemas/RankT' }
    Chnl:
      type: object
      required: [name, category]
      properties:
        name: { type: string }
        category: { $ref: '#/components/schemas/ChannelT' }
    ChannelUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string }
    InvMng:
      type: object
      required: [accept]
      properties:
        accept: { type: boolean }
    Msg:
      type: object
      required: [file_ids]
      description: At least one of `message` or a non-empty `file_ids` is required. On edit, attached files are replaced by exactly this list.
      properties:
        message: { type: string, nullable: true }
        file_ids: { type: array, items: { type: string, format: uuid } }
    UploadForm:
      type: object
      additionalProperties: { type: string, format: binary }
      description: One or more arbitrarily-named file fields, 10,000,000 bytes in total at most.

    # ---- Auth payloads ----
    TokenPair:
      type: object
      required: [access_tkn, refresh_tkn]
      properties:
        access_tkn: { type: string }
        refresh_tkn: { type: string }
    UserTokenObj:
      type: object
      required: [user_data, token_data]
      properties:
        user_data: { $ref: '#/components/schemas/User' }
        token_data: { $ref: '#/components/schemas/TokenPair' }
    UserTokenObjResponse:
      allOf:
        - $ref: '#/components/schemas/EmptyDataResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/UserTokenObj' }
    TokenPairResponse:
      allOf:
        - $ref: '#/components/schemas/EmptyDataResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/TokenPair' }
    InvJwtResponse:
      allOf:
        - $ref: '#/components/schemas/EmptyDataResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                jwt: { type: string }
    ObjectIdsResponse:
      allOf:
        - $ref: '#/components/schemas/EmptyDataResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                ids: { type: array, items: { type: string, format: uuid } }

    # ---- Pages ----
    UserPage:
      type: object
      required: [cursor, pages]
      properties:
        cursor: { type: string, format: uuid, nullable: true }
        pages: { type: array, items: { $ref: '#/components/schemas/StrippedUser' } }
    DmPage:
      type: object
      required: [cursor, pages]
      properties:
        cursor: { type: string, format: uuid, nullable: true }
        pages: { type: array, items: { $ref: '#/components/schemas/Dm' } }
    DmInvitePage:
      type: object
      required: [cursor, pages]
      properties:
        cursor: { type: string, format: uuid, nullable: true }
        pages: { type: array, items: { $ref: '#/components/schemas/Dm_Invite' } }
    GuildPage:
      type: object
      required: [cursor, pages]
      properties:
        cursor: { type: string, format: uuid, nullable: true }
        pages: { type: array, items: { $ref: '#/components/schemas/Guild' } }
    GuildInvitePage:
      type: object
      required: [cursor, pages]
      properties:
        cursor: { type: string, format: uuid, nullable: true }
        pages: { type: array, items: { $ref: '#/components/schemas/Guild_Invite' } }
    GuildMemberPage:
      type: object
      required: [cursor, pages]
      properties:
        cursor: { type: string, format: uuid, nullable: true }
        pages: { type: array, items: { $ref: '#/components/schemas/StrippedMember' } }
    ChannelPage:
      type: object
      required: [cursor, pages]
      properties:
        cursor: { type: string, format: uuid, nullable: true }
        pages: { type: array, items: { $ref: '#/components/schemas/StrippedChannel' } }
    GuildMessagePage:
      type: object
      required: [cursor, pages]
      properties:
        cursor: { type: integer, format: int64, nullable: true }
        pages: { type: array, items: { $ref: '#/components/schemas/GuildChannelMessage' } }
    DmMessagePage:
      type: object
      required: [cursor, pages]
      properties:
        cursor: { type: integer, format: int64, nullable: true }
        pages: { type: array, items: { $ref: '#/components/schemas/DmMessage' } }

    UserPageResponse:
      allOf:
        - $ref: '#/components/schemas/EmptyDataResponse'
        - type: object
          properties:
