<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="http://localhost:8000/app/main_css">
    <link rel="stylesheet" href="http://localhost:8000/app/login_css">
</head>
<body>
    <nav>
        <h1>Log In</h1>
    </nav>

    <!-- Need to add the new user and redirect to the main page -->
    <div id="container">
        <form action="http://localhost:8000/app/main">
            <label for="username">Username</label><br>
            <input type="text" id="username" placeholder="Username"><br>
            <label for="password">Password</label><br>
            <input type="password" id="password" placeholder="Password"><br>
            <input type="submit" value="Log In" id="login">
        </form>

        <form action="http://localhost:8000/app/sign_up">
            <div style="display: flex; justify-content: space-around;">
                <label id="signUpLabel">Don't have an account yet?</label>
                <input type="submit" value="Sign Up" id="signUp">
            </div>
        </form>
    </div>
</body>
</html>
