<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="http://localhost:8000/app/main_css">
    <link rel="stylesheet" href="http://localhost:8000/app/login_css">
</head>
<body>
    <nav>
        <h1>Sign Up</h1>
    </nav>

    <!-- Need to add the new user and redirect to the main page -->
    <div id="container">
        <form action="http://localhost:8000/app/main">
            <label for="username">Username</label><br>
            <input type="text" name="username" placeholder="Username"><br>
            <label for="password">Password</label><br>
            <input type="password" name="password" placeholder="Password"><br>
            <input id="signUp" type="submit" value="Sign Up">
        </form>
        
        <form action="http://localhost:8000/app/login">
            <div style="display: flex; justify-content: space-around;">
                <label id="loginLabel">Already have an account?</label><input type="submit" value="Log In">
            </div>
        </form>
    </div>
</body>
</html>
